<body>
  <header class="topbar">
    <div class="brand">
      <h1>성경 타임라인</h1>
      <nav class="tabs" aria-label="시대로 이동">
        <button data-jump="ot" aria-selected="false" title="구약 시대로 이동">구약</button>
        <button data-jump="nt" aria-selected="false" title="신약 시대로 이동">신약</button>
      </nav>
    </div>

    <div class="tools">
      <label class="search">
        <span class="sr-only">검색</span>
        <input id="search" type="search" placeholder="인물·사건·구절 검색" autocomplete="off">
      </label>
      <div id="modes" class="modes" role="group" aria-label="보기 방식">
        <button data-mode="h" title="가로 타임라인">가로형</button>
        <button data-mode="v" title="시대별 목록">카드형</button>
        <button data-mode="t" title="세로 연표 (열 = 줄, 아래로 = 시간)">세로형</button>
      </div>
      <div class="zoom" role="group" aria-label="확대/축소">
        <button id="zoom-out" title="축소 (-)" aria-label="축소">−</button>
        <button id="zoom-in" title="확대 (+)" aria-label="확대">+</button>
      </div>
      <button id="detail-toggle" class="detail-toggle" aria-pressed="false" aria-controls="detail" disabled title="고른 항목의 설명 보기">설명</button>
      <div class="filter">
        <button id="filter-btn" class="filter-btn" aria-expanded="false" aria-controls="legend" title="보일 줄 고르기"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12l-4.5 5.5V13l-3 1.5V8.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span class="filter-text">필터</span><span id="filter-count" class="filter-count" hidden></span></button>
        <div id="legend" class="legend" role="group" aria-label="보일 줄 (눌러서 켜기/끄기)" hidden></div>
      </div>
      <button id="theme" class="icon-btn" title="밝게/어둡게" aria-label="테마 전환"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
    </div>
  </header>

  <main class="stage">
    <div id="viewport" class="viewport" tabindex="0" aria-label="타임라인">
      <div id="canvas" class="canvas"></div>
    </div>

    <aside id="detail" class="detail" aria-live="polite" hidden>
      <button id="detail-close" class="detail-close" aria-label="닫기">×</button>
      <div id="detail-body"></div>
      <div id="ad-detail" class="ad-slot" hidden><span class="ad-label">광고</span></div>
    </aside>
  </main>
