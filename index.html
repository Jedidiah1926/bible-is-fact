<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>성경 타임라인</title>
  <meta name="description" content="구약과 신약의 사건과 인물을 연대순으로 살펴보는 인터랙티브 성경 타임라인">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>성경 타임라인</h1>
      <nav class="tabs" role="tablist" aria-label="구약/신약 선택">
        <button role="tab" data-view="ot" aria-selected="true">구약</button>
        <button role="tab" data-view="nt" aria-selected="false">신약</button>
      </nav>
    </div>

    <div class="tools">
      <label class="search">
        <span class="sr-only">검색</span>
        <input id="search" type="search" placeholder="인물·사건·구절 검색" autocomplete="off">
      </label>
      <button id="mode" class="mode-btn" title="세로/가로 보기 전환"></button>
      <div class="zoom" role="group" aria-label="확대/축소">
        <button id="zoom-out" title="축소 (-)" aria-label="축소">−</button>
        <button id="zoom-fit" title="전체 보기">전체</button>
        <button id="zoom-in" title="확대 (+)" aria-label="확대">+</button>
      </div>
      <button id="theme" class="icon-btn" title="밝게/어둡게" aria-label="테마 전환"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
    </div>

    <div id="legend" class="legend" aria-label="범례 (눌러서 숨기기/보이기)"></div>
  </header>

  <main class="stage">
    <div id="viewport" class="viewport" tabindex="0" aria-label="타임라인">
      <div id="canvas" class="canvas"></div>
    </div>

    <aside id="detail" class="detail" aria-live="polite" hidden>
      <button id="detail-close" class="detail-close" aria-label="닫기">×</button>
      <div id="detail-body"></div>
    </aside>
  </main>

  <footer class="hint">
    <span>드래그로 이동 · <kbd>Ctrl</kbd>+휠 또는 ± 버튼으로 확대 · <kbd>←</kbd><kbd>→</kbd> 이전/다음 사건 · 항목을 누르면 <b>같은 시기</b>의 사건이 강조됩니다</span>
    <span class="muted"><span class="hs-mark">史</span> 역사 기록 · <span class="ev-mark">✓</span> 성경 밖 자료로 확인 · <span class="rs-mark"></span> 연구·논쟁(미확인) · <span class="dp-mark"></span> 논란 많음<span class="note"> · 연대는 보수적 전통 연대 기준이며 ‘약’ 표시는 추정 연대입니다.</span></span>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/evidence.js"></script>
  <script src="js/research.js"></script>
  <script src="js/history.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
